name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@v3

    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: ⚙️ Set up Docker Compose
      uses: ndeloof/install-compose-action@v1

    - name: 🏗️ Build containers
      run: docker compose -f docker-compose.yml build

    - name: 🚀 Run containers
      run: docker compose -f docker-compose.yml up -d

    - name: 🧪 Test backend endpoint
      run: |
        sleep 10 # wait for containers to initialize
        curl --fail http://localhost:5000/api/incidents

    - name: 🧼 Stop containers
      if: always()
      run: docker compose -f docker-compose.yml down